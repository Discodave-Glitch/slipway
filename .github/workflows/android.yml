name: Build Android app (APK)

# Run it from the Actions tab: "Run workflow". Optionally type a release tag (for example v1.2.0)
# to attach the APK to that release. The APK is also saved as a download on the workflow run.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release tag (leave empty to skip)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK - accept licences and add what we need
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make a signing key for this build
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore slipway.keystore -alias slipway \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Slipway, O=Slipway, C=GB"

      - name: Build the APK
        working-directory: android
        env:
          SLIPWAY_KEYSTORE: ${{ github.workspace }}/android/app/slipway.keystore
          SLIPWAY_STOREPASS: android
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Slipway.apk
          ls -l Slipway.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Slipway-apk
          path: Slipway.apk

      - name: Attach to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" Slipway.apk --clobber

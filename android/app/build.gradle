plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.discodaveglitch.slipway'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.discodaveglitch.slipway'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // The workflow makes a key for each build and passes it in (see .github/workflows/android.yml).
            storeFile file(System.getenv('SLIPWAY_KEYSTORE') ?: 'slipway.keystore')
            storePassword System.getenv('SLIPWAY_STOREPASS') ?: 'android'
            keyAlias 'slipway'
            keyPassword System.getenv('SLIPWAY_STOREPASS') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
